<style>

  body {

<script>
const DATOS_SIMULADOR = {
  "meta": {
    "title": "Del Salar del Hombre Muerto al aula de Química",
    "audience": "Ingresantes al Profesorado de Química - Introducción a la Química",
    "objective": "Distinguir sustancia pura, mezcla homogénea y heterogénea usando criterios observables y de composición. Diferenciar fase de componente y entender el concepto de solución, solubilidad y condiciones de precipitación.",
    "role": "Integrante de un equipo de estudiantes que analiza un proceso simplificado de obtención de carbonato de litio durante una visita de estudio.",
    "initialSituation": "Un grupo de ingresantes visita el salar del Hombre Muerto junto a la Dra. Ríos y Don Héctor. Observan una piscina con salmuera transparente y deben decidir cómo caracterizarla y procesarla.",
    "storyBrief": "Un grupo de ingresantes al Profesorado de Química, que cursa Química General, visita el salar del Hombre Muerto. La Dra. Ríos, profesora de la materia, y Don Héctor, operador de la planta, acompañan al grupo. Tomás, compañero del protagonista, expresa interpretaciones frecuentes entre estudiantes y plantea alternativas que deben analizarse con evidencias.\nEl estudiante participa en cuatro decisiones químicas: cómo caracterizar la salmuera, cuándo transferirla durante la evaporación, cómo manejar el magnesio y cómo precipitar el carbonato de litio. \nLa salmuera inicial es transparente y no presenta sólidos visibles, pero contiene varias especies disueltas. Su contenido de magnesio es suficientemente elevado como para interferir en la precipitación posterior. Esta composición existe independientemente de que el estudiante decida analizarla.\nEn la primera decisión se elige entre realizar análisis iónico, conductividad, densidad, evaporación de alícuota y observación de fases, o utilizar únicamente aspecto y densidad. La primera alternativa aporta información de composición, incluida la relación Mg/Li; la segunda no permite conocerla. Analizar tiene un costo de tiempo y recursos, pero no modifica la composición de la muestra.\nN1- decisión 1: En esta etapa, los estudiantes llegan al salar y se produce el diálogo:\nDra. Ríos: \"Bienvenidos. Hoy vamos a trabajar en terreno lo que venimos viendo en clase: clasificación de sistemas materiales. Don Héctor les va a mostrar el proceso.\"\nDon Héctor: \"Chicos, miren esta piscina. Acá tenemos la salmuera que extraemos del subsuelo. De acá vamos a sacar el litio para las baterías.\"\n[Pantalla: Piscina con líquido transparente. El sol brilla sobre la superficie]\nTomás (susurra al estudiante): \"Che, esto es agua nomás. Mirá qué transparente. ¿Para qué nos trajeron? Esto es re básico.\"\nDra. Ríos: \"A ver, futuros profes. Antes de procesar esta salmuera, necesito que me digan: ¿qué tenemos acá? ¿Cómo clasifican este sistema?\"\nAcá hay tres opciones:\nOpción A: Por su aspecto deciden que es agua y no necesitan hacer nada \nTomás: \"Es agua, llevémosla a las piscinas\"\nEstudiante: \"Profe, es agua. Se ve clarita. Podemos mandarla directo a las piscinas de evaporación.\"\nTomás: \"¡Obvio! ¿Viste? Yo te dije.\"\nEsto los lleva a la N2: Dra. Ríos (sonríe): \"Interesante afirmación. ¿En qué se basan para decir que es agua? ¿Qué evidencia tienen?\"\n[Don Héctor toma una muestra y la evapora en un vidrio de reloj. Quedan cristales blancos]\nDon Héctor: \"Miren esto. ¿Esto es agua?\"\nDra. Ríos: \"Si fuera agua pura, no quedarían residuos. Lo que tienen acá es una solución: un sistema homogéneo con agua como solvente y sales disueltas como solutos. Anoten esto: la apariencia no define la naturaleza de un sistema.\" \nDra. Ríos: “Ya revisamos la idea de que era agua pura. Para decidir cómo procesar la salmuera, necesitamos conocer su composición. Completemos las pruebas que todavía no realizamos”.\n[El grupo realiza las pruebas pendientes: análisis iónico, conductividad, densidad y observación de fases. No se repite la evaporación de la alícuota. Se presenta el informe de composición, incluida la relación Mg/Li.]\nDon Héctor: “Ahora contamos con la información para continuar hacia las piscinas de evaporación”.\nBotón: “Continuar”. Lleva N4. Registrar la revisión y las pruebas adicionales, sin modificar por ello el litio de la corriente principal. No es necesario volver a elegir en N1.\nOpción B: Hacer pruebas de análisis iónico + conductividad + observación de fases + evaporación de alícuota (más tiempo y costo). Diálogo:\nEstudiante: \"Profe, antes de clasificarlo, deberíamos hacer pruebas. ¿Podemos medir densidad, conductividad, análisis iónico, evaporar una muestra y observar las fases?\"\nDra. Ríos: \"Excelente actitud científica?\"\n[El estudiante elige pruebas: Observación de fases, análisis iónico, evaporación de alícuota, densidad, conductividad]\nDra. Ríos: \"¿Qué concluyen?\"\nEstudiante: \"Que no es agua pura. Tiene solutos disueltos. Es una solución, un sistema homogéneo.\"\nTomás: \"Ah... yo pensé que como se veía transparente, era agua.\"\nDra. Ríos: \"Ese es un error muy común, Tomás. La transparencia no es criterio de clasificación. Lo que define si es sustancia o mezcla son las propiedades y la composición.\"\nEsto lleva a N4\nOpción C: Solo aspecto y densidad (más rápido y más barato).\nDiálogo: \nEstudiante: \"Profe, antes de clasificarlo podemos medir densidad y observar el aspecto de la muestra\"\nDra. Ríos: \"Bien. ¿Qué proponen?\"\n[El estudiante elige pruebas: Aspecto y densidad]\nEsto los lleva a la escena de N3\nDra. Ríos: \"¿Qué concluyen?\"\nEstudiante: \"Que no es agua pura. Tiene solutos disueltos. Es una solución, un sistema homogéneo.\"\nTomás: \"Ah... yo pensé que como se veía transparente, era agua.\"\nDra. Ríos: \"Ese es un error muy común, Tomás. La transparencia no es criterio de clasificación. Lo que define si es sustancia o mezcla son las propiedades y la composición.\"\nDon Héctor: \"Si bien pudieron determinar que no es agua, sino una mezcla homogénea. Las pruebas no alcanzan para determinar la composición y cómo seguir con el proceso.\"\nDra. Ríos: “Para continuar, completemos la caracterización con las pruebas que faltan”.\n[El grupo realiza análisis iónico, conductividad y evaporación de una alícuota, y completa la observación de fases. Se presenta el informe de composición, incluida la relación Mg/Li. No se repite la medición de densidad.]\nDon Héctor: “Con el informe completo ya podemos decidir cómo continuar con el proceso”.\nBotón: “Continuar”. Destino: N4. Registrar que fue necesario completar la caracterización, sin modificar por ello el litio de la corriente principal. No es necesario volver a elegir en N1.\nEn N4 . Decisión 2 se elige transferir temprano, transferir al alcanzar el criterio operativo establecido para esta salmuera o prolongar la evaporación. La transferencia temprana conserva el litio, pero requiere una reconcentración posterior. La transferencia en el momento establecido evita ese reprocesamiento. En la transferencia tardía, el informe del caso indica que parte del litio queda retenido en el depósito salino separado del circuito. Esa fracción no vuelve a las etapas siguientes. No se presenta esta consecuencia como una propiedad universal de todas las salmueras.\n[Pantalla: Don Héctor los lleva a las piscinas de evaporación]\nDon Héctor: \"Bien, ahora que saben que es una solución con Li⁺, Na⁺, Mg²⁺ y Cl⁻, el desafío es concentrar el litio. El NaCl es mucho más abundante, así que hay que sacarlo primero. ¿Cómo lo harían?\"\nDra. Ríos: \"Piensen: ¿qué técnicas de separación para sistemas homogéneos conocen? ¿Y para sistemas heterogéneos?\"\nEstudiante: \"Profe, si evaporamos el agua, las sales se concentran\"\nDra. Ríos: \"Bien, un dato importante es que el NaCl tiene menor solubilidad que el LiCl, así que el NaCl precipita primero. El primer sólido que veamos al evaporar será esa sal. A partir de ahí podemos separar el sólido del líquido\"\nDon Héctor: \"Exactamente, ahora tenemos que decidir en qué momento tomamos la decisión de separar la solución sobrenadante del sedimento que queda en el fondo\"\nOpción A: Evaporar hasta que aparezca NaCl depositado en el fondo y transferir temprano (para no correr el riesgo de que parte del Li quede en los depósitos sólidos): \nLa transferencia es temprana: la halita aún precipita, así que se arrastra mucho Na⁺ y Cl⁻ y la salmuera queda poco concentrada. \nEstudiante: \"Profe, si evaporamos el agua, las sales se concentran. Pero puede quedar Litio, yo lo sacaría pronto, apenas veamos un poco de sólido, por las dudas\"\nDra. Ríos: \"¿Y qué tipo de sistema tienen después de evaporar?\"\nEstudiante: \"Heterogéneo: sólido (NaCl precipitado) + líquido (salmuera concentrada en Li⁺).\"\nDon Héctor: \"El problema de transferirlo tan temprano es que se arrastra mucho Na⁺ y Cl⁻ y la salmuera queda poco concentrada. Vamos a tener que seguir evaporando acá, dejar que se formen y se depositen más cristales de halita y volver a decantar. El litio sigue en la solución, pero todavía no alcanzamos la concentración prevista. si bien no perdemos Litio, sí se requiere más tiempo de permanencia y ocupar capacidad que se esperaba usar para otra etapa.\"\nEsto va a N5: [Antes de continuar, se realiza la evaporación adicional descrita por Don Héctor, se dejan depositar los nuevos cristales de halita y se vuelve a decantar. Los controles indican que la salmuera alcanzó las condiciones previstas. Se registra el tiempo y la capacidad adicionales utilizados; en esta simplificación no se pierde litio en esta recuperación.]\nDon Héctor: \"Perdimos un poco de tiempo…”\nBotón: “Continuar”. Destino: N7, decisión 3.\nOpción B: Completar la etapa de separación de halita y transferir en el momento previsto.\nEstudiante: “Yo esperaría a que se separe la cantidad de halita prevista para esta etapa, pero sin seguir evaporando hasta que el litio empiece a quedar en los depósitos sólidos”.\nDra. Ríos: “¿Qué información necesitarían para reconocer ese momento?”.\nDon Héctor: “No alcanza con mirar cuánto sólido hay. Tenemos que controlar la concentración de la salmuera y compararla con los datos del proceso”.\n[En pantalla aparece un informe simplificado: se alcanzó la concentración prevista para la transferencia; el litio permanece disuelto.]\nDon Héctor: “Los controles indican que llegamos al momento de transferir. Dejamos los cristales depositados en el fondo y pasamos la salmuera sobrenadante a la siguiente pileta”.\nTomás: “Entonces, ¿pasamos solamente el litio?”.\nDra. Ríos: “¿Qué nos mostraba el análisis inicial? ¿Había una sola sal disuelta?”.\nEstudiante: “No. Separamos parte del cloruro de sodio como sólido, pero en la solución todavía quedan litio y otros iones disueltos”.\nDon Héctor: “Exactamente. La salmuera está más concentrada en litio, pero todavía tenemos que tratar otras sustancias antes de obtener el producto”.\nConsecuencia: Se completa la etapa prevista de separación de halita y se conserva el litio en la solución que continúa hacia el tratamiento siguiente, sin requerir la reconcentración adicional de la opción A.\nEsto los lleva al N7 decisión 3. \nOpción C: Prolongar la evaporación para alcanzar la mayor concentración posible.\nEstudiante: “Yo seguiría evaporando. Cuanta menos agua quede, más concentrada va a estar la solución y más litio podremos recuperar”.\nTomás: “Sí, y si aparece más sólido, mejor: ya estaríamos separando más sales”.\nDra. Ríos: “¿Una solución más concentrada necesariamente contiene una mayor cantidad de litio? ¿Qué podría pasar si seguimos formando depósitos sólidos?”.\nEsto va a N6\nDon Héctor: “Nos pasamos del momento previsto. Para esta salmuera, al prolongar la evaporación, parte del litio queda retenida en los depósitos salinos”.\nEstudiante: “Entonces, aunque la solución esté más concentrada, ya no tenemos todo el litio inicial en ella”.\nDon Héctor: “Así es. Si transferimos el líquido y dejamos estos depósitos fuera del circuito, también dejamos atrás el litio que contienen”.\n[Pantalla: Se muestran dos fracciones: la salmuera transferida y el depósito salino separado que contiene parte del litio.]\nDra. Ríos: “La concentración relaciona la cantidad de soluto con una cantidad de solución o de solvente. Al evaporar agua podemos aumentar la concentración, pero eso no garantiza conservar todo el litio en la fase líquida”.\nTomás: “Yo estaba pensando solamente en sacar agua. No había considerado qué pasaba con el litio mientras se formaban los sólidos”.\nDon Héctor: “Las etapas siguientes van a trabajar con la salmuera transferida. Para intentar recuperar el litio que quedó en los depósitos necesitaríamos otro tratamiento, que no está incluido en este recorrido”.\nDon Héctor: “Vamos a continuar con la salmuera que transferimos. El litio que quedó en los depósitos sigue fuera de este circuito”.\nBotón: “Continuar con la salmuera restante”. Destino: N7, decisión 3. Conservar la pérdida registrada hasta el cierre; ninguna decisión posterior restituye ese litio.\n[Pantalla: Se muestran dos fracciones: la salmuera transferida y el depósito salino separado que contiene parte del litio.]\nTomás: “Yo estaba pensando solamente en sacar agua. No había considerado qué pasaba con el litio mientras se formaban los sólidos”.\nEn la tercera decisión N7 D3 se elige continuar sin remover magnesio o agregar cal y separar por filtración el precipitado de Mg(OH)₂. La remoción reduce la interferencia del magnesio, pero consume reactivo y genera un residuo sólido. Las otras impurezas y el calcio incorporado quedan fuera del modelo simplificado y deben declararse como limitación.\nDiálogo:\n¿Cómo continuamos con la salmuera concentrada?\n[Pantalla: La salmuera llega al sector de tratamiento. Está disponible el informe de composición obtenido al comienzo.]\nDon Héctor: “El siguiente objetivo es obtener carbonato de litio, Li₂CO₃, lo más puro posible. Para formarlo vamos a agregar carbonato de sodio a la solución”.\nTomás: “Ya concentramos la salmuera y separamos los cristales de halita. ¿Pasamos a esa etapa?”.\nDon Héctor: “Tenemos dos alternativas: continuar directamente o hacer primero un tratamiento con cal y una filtración. Ese tratamiento permite separar magnesio como hidróxido de magnesio, pero requiere reactivo, tiempo y gestionar el sólido que se genera”.\nTomás: “Podríamos continuar con la salmuera que tenemos y analizar el producto obtenido. Así evitamos agregar otra etapa”.\nDra. Ríos: “Revisen el informe de composición y el objetivo del proceso. ¿Qué alternativa elegirían? ¿En qué información se apoyan?”.\nOpción A. Continuar sin remover previamente el magnesio.\nEstudiante: “Continuemos directamente. Así evitamos consumir cal y hacer una filtración adicional”.\nDon Héctor: “Obtuvimos un sólido, pero contiene compuestos de magnesio. Haber formado un precipitado no significa que hayamos obtenido carbonato de litio puro”.\nTomás: “A simple vista parece un único polvo blanco. No podemos distinguir qué contiene solamente mirándolo”.\nDra. Ríos: “¿Qué diferencia encuentran entre separar una fase sólida y obtener una sustancia pura?”.\nEsto lleva a N8, decisión 4, sin agregar todavía carbonato de sodio. El magnesio permanece en la corriente y se conserva esta condición hasta la precipitación. Las explicaciones sobre la contaminación del producto se muestran después, en F1, si corresponde.\nOpción B. Agregar cal para precipitar el magnesio y filtrar antes de incorporar el carbonato de sodio.\nEstudiante: “Primero separemos el magnesio. Agregamos cal y después filtramos el sólido formado”.\n[Pantalla: Se agrega cal a la salmuera. Aparece un precipitado blanco de Mg(OH)₂.]\nDon Héctor: “Los iones hidróxido reaccionan con los iones magnesio y forman hidróxido de magnesio sólido”.\nMg²⁺(aq) + 2 OH⁻(aq) → Mg(OH)₂(s)\nDra. Ríos: “Antes teníamos una solución sin sólidos visibles. ¿Cómo describirían el sistema ahora?”.\nEstudiante: “Es heterogéneo: tenemos una fase líquida y una fase sólida”.\nTomás: “¿Y ahora filtramos para quedarnos con el sólido?”.\nEstudiante: “En esta etapa necesitamos conservar el líquido, porque el litio sigue disuelto. El hidróxido de magnesio queda retenido en el filtro”.\nDon Héctor: “El filtrado tiene menos magnesio y puede continuar a la precipitación del carbonato de litio. Usamos reactivo y generamos un lodo que debemos gestionar”.\nConsecuencia: Disminuye el magnesio que llega a la precipitación del litio. Se consume cal, se incorpora una filtración y se genera un residuo sólido.\nEsto lleva a la N8 decisión 4: Condiciones de precipitación del carbonato de litio.\nEn la cuarta decisión se elige agregar carbonato de sodio en exceso y trabajar en frío, o utilizar una dosis ajustada al litio estimado y calentar. El modelo representa cualitativamente las diferencias de recuperación y contaminación. No calcula un equilibrio químico real ni certifica calidad comercial.\nDiálogo: ¿En qué condiciones obtenemos el carbonato de litio?\n[Pantalla: El grupo llega al sector de precipitación. Se observan un recipiente con la salmuera, carbonato de sodio y un equipo de calentamiento. La composición de la salmuera depende de las decisiones anteriores.]\nDon Héctor: “Llegamos a la etapa de obtener el carbonato de litio. Agregamos carbonato de sodio, que aporta los iones carbonato necesarios para formar el sólido”.\n2 Li⁺(aq) + CO₃²⁻(aq) → Li₂CO₃(s)\nDon Héctor: “Podemos trabajar en frío y agregar reactivo en exceso, o ajustar la dosis al litio que tenemos y calentar la solución. Calentar requiere energía; agregar un exceso consume más reactivo”.\nTomás: “Yo probaría en frío. Cuando calentamos, las sustancias suelen disolverse más. Y con un poco de reactivo de sobra nos aseguramos de que alcance”.\nDra. Ríos: “¿Esa relación entre temperatura y solubilidad se cumple para todas las sustancias? ¿Cómo podríamos comprobar qué ocurre con el carbonato de litio?”.\nAntes de confirmar: ¿En cuál de las condiciones esperás recuperar más litio como sólido? Fundamentá tu predicción.\nOpción A. Trabajar en frío y agregar carbonato de sodio en exceso.\n[Pantalla: Se forma un precipitado blanco. Después de separarlo por filtración, se analizan el sólido y el líquido.]\nDon Héctor: “Recuperamos carbonato de litio, pero el análisis del filtrado muestra que todavía quedó litio disuelto”.\nDra. Ríos: “En las condiciones de este caso, el carbonato de litio es más soluble en frío que en caliente. Agregar reactivo en exceso no garantiza recuperar todo el litio como sólido”.\nTomás: “Entonces tenemos que mirar tanto lo que quedó en el filtro como lo que pasó al líquido”.\nDespués de mostrar íntegramente esta consecuencia: si se realizó el tratamiento previo del magnesio, lleva al final F2: Menor recuperación de litio como sólido y mayor consumo de reactivo. Si no realizó el tratamiento previo del magnesio lleva a F1\nOpción B. Calcular una dosis ajustada de carbonato de sodio y trabajar con calentamiento.\n[Pantalla: Se dosifica el carbonato de sodio y se calienta la solución. Se forma un precipitado blanco que luego se separa por filtración.]\nDon Héctor: “En estas condiciones recuperamos una mayor proporción del litio como carbonato sólido, aunque consumimos energía para calentar”.\nTomás: “Esta vez calentar favoreció que quedara menos disuelto. No era como yo esperaba”.\nDra. Ríos: “Por eso necesitamos conocer el comportamiento de cada sustancia. ¿Y podemos afirmar que el sólido es puro solamente porque recuperamos más cantidad?”.\nDespués de mostrar íntegramente esta consecuencia: si se realizó el tratamiento previo del magnesio, lleva al final F3: Mayor recuperación de litio como sólido y dosificación controlada del reactivo, con consumo de energía. La pureza depende también del tratamiento previo. Si no se realizó ese tratamiento, lleva al final F1, conservando además el diagnóstico de mayor recuperación en esta etapa con calentamiento.\nFinal F1, compartido por ambas opciones de la decisión 4 cuando no se trató previamente el magnesio:\n[Después de la precipitación y la separación del sólido, el análisis detecta compuestos de magnesio en el producto. Se muestran las intervenciones siguientes.]\nDon Héctor: “Obtuvimos un sólido, pero contiene compuestos de magnesio. Haber formado un precipitado no significa que hayamos obtenido carbonato de litio puro”.\nTomás: “A simple vista parece un único polvo blanco. No podemos distinguir qué contiene solamente mirándolo”.\nDra. Ríos: “¿Qué diferencia encuentran entre separar una fase sólida y obtener una sustancia pura?”.\nSe evita el tratamiento previo, pero el magnesio interfiere en la precipitación y contamina el producto. Para mejorar su pureza sería necesario un tratamiento adicional.\nEn F1, F2 y F3, agregar al diagnóstico —sin sustituir los diálogos anteriores— si se completó la caracterización después de una revisión, si hubo evaporación y decantación adicionales, y si quedó litio en los depósitos separados. La mayor recuperación en la precipitación en caliente no compensa automáticamente una pérdida previa de litio. No se incluye una nueva purificación del producto dentro de este recorrido.\nAl finalizar, se presenta la historia de las decisiones, la información que estaba disponible en cada momento, el destino del litio, las fases presentes, el tratamiento del magnesio y los recursos utilizados. Se distingue entre lo que efectivamente ocurrió en el sistema y lo que el estudiante podía conocer.\nDebe permitir reiniciar y comparar decisiones sin modificar la salmuera inicial en esta primera versión.",
    "variablesBrief": "TratamientoMg (si/no, inicia en no): N7-A mantiene no; N7-B asigna si. Registra si se agregó cal y se filtró el Mg(OH)₂. Ningún nodo posterior modifica este valor.\n\nPrecipitacionCaliente (si/no, inicia en no): N8-A asigna no y N8-B asigna si.\n\nPerdidaLitio (si/no, inicia en no): N4-C asigna si, porque parte del litio queda en los depósitos separados. N6 y los nodos posteriores conservan ese valor hasta el cierre.\n\nReconcentracion (si/no, inicia en no): N4-A asigna si. En N5 se realiza la evaporación y decantación adicionales y se mantiene el registro de que fueron necesarias.\n\nRevisionInicial (si/no, inicia en no): N1-A y N1-C asignan si. N2 y N3 completan la caracterización y conservan el registro de la revisión. N1-B mantiene no.\n\nTodas son variables booleanas y utilizan los valores si/no, sin tilde. Describen el recorrido y sus consecuencias; no son puntajes de respuestas correctas.\n\nFinales:\n\nF1 — Producto con compuestos de magnesio: se alcanza si TratamientoMg = no, tanto desde N8-A como desde N8-B.\n\nF2 — Menor recuperación en la precipitación: se alcanza si TratamientoMg = si y se elige N8-A, trabajo en frío con exceso de carbonato de sodio.\n\nF3 — Condiciones favorables de precipitación: se alcanza si TratamientoMg = si y se elige N8-B, dosis ajustada con calentamiento.\n\nCrear F1, F2 y F3 como tres nodos de tipo final, sin opciones de salida.\n\nEn N8-A, la condición de destino es: Va a F2 si TratamientoMg = si; si no, va a F1.\n\nEn N8-B, la condición de destino es: Va a F3 si TratamientoMg = si; si no, va a F1.\n\nLas dos opciones de N8 están siempre disponibles. PerdidaLitio, Reconcentracion y RevisionInicial enriquecen el diagnóstico, pero no modifican estas conexiones.\n\nN2 y N3 tienen una única opción “Continuar” hacia N4. N5 y N6 tienen una única opción de continuación hacia N7. No son finales y sus botones no incorporan nuevas decisiones químicas.\n\nEn todos los finales se informa si hubo revisión inicial, reconcentración o pérdida previa de litio. Se distingue pureza de recuperación y no se suma ni se resta litio por analizar, clasificar o calentar."

function initVars() {
  const v = {};
  DATOS_SIMULADOR.variables.forEach(item => {
    if (item.type === 'number') {
      v[item.name] = Number(item.initial);
    } else {
      const s = String(item.initial ?? 'no').toLowerCase().trim();
      v[item.name] = (s === 'si' || s === 'sí' || s === 'true') ? 'si' : s;
    }
  });
  return v;
}

function findVarName(raw) {
  const clean = String(raw || '').trim().toLowerCase();
  const found = DATOS_SIMULADOR.variables.find(v => v.name.toLowerCase() === clean);
  return found ? found.name : null;
}

function applyEffects(vars, effectsStr) {
  const next = Object.assign({}, vars);
  if (!effectsStr || effectsStr.trim() === '—' || effectsStr.trim() === '-') return next;
  effectsStr.split(/[;,]/).map(s => s.trim()).filter(Boolean).forEach(part => {
    const assign = part.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*=\s*(.+)$/);
    if (assign) {
      const vn = findVarName(assign[1]);
      const val = assign[2].trim().toLowerCase();
      if (vn) next[vn] = (val === 'si' || val === 'sí' || val === 'true') ? 'si' : val;
      return;
    }
    const delta = part.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*([+\-−])\s*(\d+(\.\d+)?)$/);
    if (delta) {
      const vn = findVarName(delta[1]);
      const sign = delta[2] === '+' ? 1 : -1;
      const num = parseFloat(delta[3]);
      if (vn && typeof next[vn] === 'number') {
        next[vn] = Math.max(0, Math.min(10, next[vn] + sign * num));
      }
    }
  });
  return next;
}

function evalCondition(vars, expr) {
  if (!expr || !expr.trim()) return true;
  const clean = expr.trim().replace(/^(la opción aparece solo si|la opcion aparece solo si|aparece solo si|solo si)\s+/i, '').trim();
  const m = clean.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*(>=|<=|≥|≤|=|>|<|mayor o igual que|menor o igual que|menor que|mayor que)\s*(.+)$/i);
  if (!m) return true;
  const vn = findVarName(m[1]);
  if (!vn) return true;
  const op = m[2].toLowerCase();
  const rhs = m[3].trim().toLowerCase().replace(/\.$/, '');
  const cur = vars[vn];
  if (typeof cur === 'number') {
    const n = parseFloat(rhs);
    if (op === '>=' || op === '≥' || op === 'mayor o igual que') return cur >= n;
    if (op === '<=' || op === '≤' || op === 'menor o igual que') return cur <= n;
    if (op === '>' || op === 'mayor que') return cur > n;
    if (op === '<' || op === 'menor que') return cur < n;
    if (op === '=') return cur === n;
  } else {
    const cNorm = (cur === 'si' || cur === 'sí') ? 'si' : String(cur).toLowerCase();
    const rNorm = (rhs === 'si' || rhs === 'sí') ? 'si' : rhs;
    if (op === '=') return cNorm === rNorm;
  }
  return true;
}

function resolveDest(opt, varsAfter) {
  if (opt.targetCondition) {
    const bm = opt.targetCondition.match(/va a\s+([A-Za-z0-9_]+)\s+si\s+([^;]+);\s*si\s*no,?\s*(?:va a\s*)?([A-Za-z0-9_]+)/i);
    if (bm) return evalCondition(varsAfter, bm[2]) ? bm[1].trim() : bm[3].trim();
  }
  return String(opt.to || '').split(/\s+o\s+/)[0].trim();
}

function escapeHtml(s) {
  return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function beginWithStudent() {
  const n = document.getElementById('st-name').value.trim();
  const id = document.getElementById('st-id').value.trim();
  const err = document.getElementById('st-err');
  if (!n) {
    err.style.display = 'block';
    err.textContent = 'Por favor ingresá tu Nombre y Apellido para iniciar.';
    return;
  }
  state.studentName = n;
  state.studentId = id;
  state.registered = true;
  render();
}

async function sendResultToSheet() {
  const btn = document.getElementById('btn-sheet-submit');
  if (!btn || state.submitted) return;
  btn.disabled = true;
  btn.textContent = 'Enviando registro a la cátedra...';

  const node = DATOS_SIMULADOR.nodes.find(n => n.id === state.currentNodeId);
  const routeCode = state.history.map(h => h.optionId).concat([node ? node.id : '']).join(', ');
  const varsSummary = DATOS_SIMULADOR.variables.map(v => v.name + ': ' + state.vars[v.name]).join(' | ');
  const stepsSummary = state.history.map((h, i) => (i+1) + '. ' + h.optionId + ' (' + h.optionText + ')').join(' -> ');

  const payload = {
    studentName: state.studentName || 'Sin nombre',
    studentId: state.studentId || '-',
    simTitle: DATOS_SIMULADOR.meta.title,
    finalNode: node ? (node.id + ' - ' + node.title) : '',
    routeCode: routeCode,
    finalVars: varsSummary,
    stepsDetail: stepsSummary
  };

  if (DATOS_SIMULADOR.sheetsWebhookUrl) {
    try {
      await fetch(DATOS_SIMULADOR.sheetsWebhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      state.submitted = true;
      btn.textContent = '✓ Recorrido registrado correctamente en la planilla docente';
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Reintentar envío a la planilla';
    }
  } else {
    state.submitted = true;
    btn.textContent = '✓ Finalización confirmada (Copiá tu código abajo)';
  }
}

function render() {
  document.getElementById('sim-title').textContent = DATOS_SIMULADOR.meta.title;
  document.getElementById('sim-role').textContent = 'Rol: ' + DATOS_SIMULADOR.meta.role + (state.studentName ? ' · Alumno/a: ' + state.studentName : '');
  const screen = document.getElementById('sim-screen');

  if (!state.registered) {
    screen.innerHTML = '<div class="content">' +
      '<span class="badge badge-decision">Registro de Estudiante</span>' +
      '<h2>' + escapeHtml(DATOS_SIMULADOR.meta.title) + '</h2>' +
      '<p style="color:var(--muted);margin-bottom:10px;">Ingresá tus datos antes de comenzar. Al finalizar el caso, tu recorrido quedará registrado para el docente.</p>' +
      '<div id="st-err" class="msg-banner"></div>' +
      '<div class="login-box">' +
      '<label class="field-label">Nombre y Apellido *</label>' +
      '<input type="text" id="st-name" class="field-input" placeholder="Ej: Juan Pérez" value="' + escapeHtml(state.studentName) + '">' +
      '<label class="field-label">Legajo / DNI (Opcional)</label>' +
      '<input type="text" id="st-id" class="field-input" style="margin-bottom:0;" placeholder="Ej: 40123456" value="' + escapeHtml(state.studentId) + '">' +
      '</div>' +
      '<button class="option-btn" onclick="beginWithStudent()"><span>Comenzar simulación →</span></button>' +
      '</div>';
    return;
  }

  const node = DATOS_SIMULADOR.nodes.find(n => n.id === state.currentNodeId);
  if (!node) return;

  let visual = '';
  if (node.visualType === 'svg' && node.visualContent) {
    visual = '<div class="visual-box">' + node.visualContent + '</div>';
  } else if (node.visualType === 'image' && node.visualContent) {
    visual = '<div class="visual-box"><img src="' + node.visualContent + '" alt=""></div>';
  }

  if (state.pendingConsequence) {
    screen.innerHTML = visual + '<div class="content">' +
      '<span class="badge badge-decision">Consecuencia inmediata</span>' +
      '<p class="situation-text">' + escapeHtml(state.pendingConsequence.text) + '</p>' +
      '<button class="option-btn" onclick="continueStep()"><span>Continuar →</span></button>' +
      '</div>';
    return;
  }

  if (node.type === 'final') {
    const code = state.history.map(h => h.optionId).concat([node.id]).join(', ');
    const varsHtml = DATOS_SIMULADOR.variables.map(v => {
      const val = state.vars[v.name];
      if (v.type === 'number') {
        const pct = Math.round((Number(val)/10)*100);
        return '<div class="var-card"><div><strong>' + escapeHtml(v.name) + ':</strong> ' + val + ' / 10</div>' +
               '<div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
      }
      return '<div class="var-card"><strong>' + escapeHtml(v.name) + ':</strong> ' + escapeHtml(val) + '</div>';
    }).join('');

    const histHtml = state.history.map((h, i) =>
      '<div class="step-item"><strong>Paso ' + (i+1) + ' (' + escapeHtml(h.optionId) + '):</strong> ' +
      escapeHtml(h.nodeText) + '<br><em>Elegiste: ' + escapeHtml(h.optionText) + '</em></div>'
    ).join('');

    const submitBox = '<div class="submit-sheet-box">' +
      '<div style="font-size:13px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.9;">Confirmación de finalización</div>' +
      '<div style="font-size:20px;font-weight:800;margin:4px 0;">Registrar mi recorrido para el docente</div>' +
      '<div style="font-size:15px;opacity:0.95;">Estudiante: <strong>' + escapeHtml(state.studentName || 'Registrado') + '</strong> · Código: <strong>' + escapeHtml(code) + '</strong></div>' +
      '<button id="btn-sheet-submit" class="submit-sheet-btn" onclick="sendResultToSheet()" ' + (state.submitted ? 'disabled' : '') + '>' +
      (state.submitted ? '✓ Recorrido registrado correctamente en la planilla docente' : '✓ Finalizar y Enviar mi Recorrido al Docente') +
      '</button></div>';

    screen.innerHTML = visual + '<div class="content">' +
      '<span class="badge badge-final">Final · ' + escapeHtml(node.id) + '</span>' +
      '<h2>' + escapeHtml(node.title) + '</h2>' +
      '<p class="situation-text">' + escapeHtml(node.text) + '</p>' +
      '<div class="closing-box"><strong>Comentario de cierre:</strong><br>' + escapeHtml(node.closingComment) + '</div>' +
      submitBox +
      '<h3>Valores finales de las variables</h3><div class="vars-grid">' + varsHtml + '</div>' +
      '<h3>Recorrido completo</h3>' + histHtml +
      '<div class="code-box"><div><small style="color:#A8A09A;display:block;">CÓDIGO DE RECORRIDO</small><strong id="route-code">' + escapeHtml(code) + '</strong></div>' +
      '<button class="secondary-btn" onclick="copyCode()">Copiar código</button></div>' +
      '<button class="option-btn" onclick="restartSim()"><span>Volver a empezar</span></button>' +
      '</div>';
    return;
  }

  const opts = DATOS_SIMULADOR.options.filter(o => o.from === node.id && (!o.appearCondition || evalCondition(state.vars, o.appearCondition)));
  const optsHtml = opts.map(o =>
    '<button class="option-btn" onclick="chooseOption(\'' + o.id + '\')">' +
    '<span class="opt-letter">' + escapeHtml(o.label) + '</span>' +
    '<span>' + escapeHtml(o.text) + '</span></button>'
  ).join('');

  screen.innerHTML = visual + '<div class="content">' +
    '<span class="badge badge-decision">Situación · ' + escapeHtml(node.id) + '</span>' +
    '<p class="situation-text">' + escapeHtml(node.text) + '</p>' +
    '<div class="options-list">' + optsHtml + '</div></div>';
}

function chooseOption(optId) {
  const opt = DATOS_SIMULADOR.options.find(o => o.id === optId);
  const node = DATOS_SIMULADOR.nodes.find(n => n.id === state.currentNodeId);
  if (!opt || !node) return;
  state.vars = applyEffects(state.vars, opt.effects);
  const nextId = resolveDest(opt, state.vars);
  state.history.push({ nodeId: node.id, nodeText: node.text, optionId: opt.id, optionText: opt.text });
  if (opt.immediateConsequence && opt.immediateConsequence.trim() !== '—') {
    state.pendingConsequence = { text: opt.immediateConsequence, nextNodeId: nextId };
  } else {
    state.currentNodeId = nextId;
  }
  render();
}

function continueStep() {
  if (state.pendingConsequence) {
    state.currentNodeId = state.pendingConsequence.nextNodeId;
    state.pendingConsequence = null;
    render();
  }
}

function copyCode() {
  const code = document.getElementById('route-code').textContent;
  const t = document.createElement('textarea');
  t.value = code;
  document.body.appendChild(t);
  t.select();
  document.execCommand('copy');
  document.body.removeChild(t);
}

function restartSim() {
  state = {
    registered: state.studentName ? true : (!DATOS_SIMULADOR.requireLogin),
    studentName: state.studentName,
    studentId: state.studentId,
    submitted: false,
    currentNodeId: DATOS_SIMULADOR.nodes[0].id,
    vars: initVars(),
    history: [],
    pendingConsequence: null
  };
  render();
}

state.vars = initVars();
render();
</script>
</body>
</html>
